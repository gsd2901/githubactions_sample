name: Push Comment (triggered by local push)

on:
  push:
    branches: [main]
    paths:
      - 'comments/current.md'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const TITLE = 'NAAC Pipeline Comments (test)';
            const { owner, repo } = context.repo;
            const body = fs.readFileSync('comments/current.md', 'utf8');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            let issue = openIssues.find((i) => i.title === TITLE && !i.pull_request);

            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo, title: TITLE,
                body: 'Tracking issue for pushed test comments (mirrors NAAC pipeline comment format).',
              });
              issue = created.data;
              core.info(`Created tracking issue #${issue.number}`);
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body,
            });

            core.info(`Posted comment to issue #${issue.number}`);
