name: Heartbeat Comment (triggered by local push)

# This fires when the local heartbeat script (running on Surya's Mac via
# launchd) pushes an updated heartbeat/heartbeat.log file. Also runnable
# on-demand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'heartbeat/**'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Post heartbeat comment
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'GitHub Actions Heartbeat';
            const { owner, repo } = context.repo;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            let issue = openIssues.find(
              (i) => i.title === TITLE && !i.pull_request
            );

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: TITLE,
                body:
                  'Tracking issue for periodic heartbeat pushes from a local ' +
                  'script. Leave this open — each push adds a new comment below.',
              });
              issue = created.data;
              core.info(`Created tracking issue #${issue.number}`);
            }

            const now = new Date().toISOString();
            const body = [
              '### Heartbeat',
              '',
              '| Field | Value |',
              '|---|---|',
              `| Run | #${context.runNumber} |`,
              `| Run ID | ${context.runId} |`,
              `| Triggered by | ${context.eventName} |`,
              `| Commit | ${context.sha.substring(0, 7)} |`,
              `| Timestamp (UTC) | ${now} |`,
              '| Status | ✅ pass |',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });

            core.info(`Posted heartbeat comment to issue #${issue.number}`);
