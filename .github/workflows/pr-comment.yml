name: PR Comment (CHG test)

# Posts the next comment in sequence on the PR each time it fires:
# PR opened -> 01_checklist.md, next push -> 02_catalog_pr.md, and so on
# through all six comments/*.md files. Mirrors the NAAC bot posting a
# new gate-status comment as the real pipeline progresses.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      comment_file:
        description: 'Force-post a specific file under comments/ (overrides auto-sequence)'
        required: false
      pr_number:
        description: 'PR number to comment on (required for manual runs)'
        required: false

permissions:
  pull-requests: write
  issues: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post next comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const SEQUENCE = [
              '01_checklist.md',
              '02_catalog_pr.md',
              '03_config_preview.md',
              '04_lab_postcheck.md',
              '05_prod_postcheck.md',
              '06_infoblox_usage.md',
            ];

            const prNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : Number(core.getInput('pr_number'));

            if (!prNumber) {
              core.setFailed('No PR number available (pass pr_number for manual runs).');
              return;
            }

            const forcedFile = core.getInput('comment_file');
            let file;

            if (forcedFile) {
              file = `comments/${forcedFile}`;
            } else {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const botComments = comments.filter((c) => c.user?.type === 'Bot');
              const nextIndex = botComments.length;

              if (nextIndex >= SEQUENCE.length) {
                core.info(`All ${SEQUENCE.length} comments already posted on PR #${prNumber}, nothing to do.`);
                return;
              }
              file = `comments/${SEQUENCE[nextIndex]}`;
            }

            const body = fs.readFileSync(file, 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

            core.info(`Posted ${file} to PR #${prNumber}`);
